<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>TinyNote</title>
<meta name="description" content="TinyNote — a private, fast notepad. Nothing leaves your device." />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"><div id="app" class="app-root">

  <!-- SIDEBAR -->
  <aside class="sidebar glass-strong" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-mark shine"><svg viewBox="0 0 24 24" class="icon"><use href="#i-feather"/></svg></div>
      <div class="brand-text">
        <div class="brand-title">TinyNote</div>
        <div class="brand-sub">private · fast</div>
      </div>
      <button class="btn-icon ml-auto" id="btnNewNoteTop" title="New note (⌘N)" aria-label="New note">
        <svg viewBox="0 0 24 24" class="icon"><use href="#i-plus"/></svg>
      </button>
    </div>

    <div class="sidebar-search-wrap">
      <div class="search-box glass">
        <svg viewBox="0 0 24 24" class="icon icon-sm muted"><use href="#i-search"/></svg>
        <input id="searchInput" class="search-input" placeholder="Search notes…" aria-label="Search notes" />
        <button id="btnClearSearch" class="hidden" aria-label="Clear">
          <svg viewBox="0 0 24 24" class="icon icon-sm muted"><use href="#i-x"/></svg>
        </button>
      </div>
      <div id="recentSearches" class="recent-searches"></div>
    </div>

    <div class="sidebar-tabs">
      <button id="tabAll" class="tab-btn tab-active">All</button>
      <button id="tabTrash" class="tab-btn">Trash</button>
      <div class="ml-auto sort-wrap">
        <svg viewBox="0 0 24 24" class="icon icon-xs muted"><use href="#i-sort"/></svg>
        <select id="sortSelect" class="sort-select" aria-label="Sort by">
          <option value="updated">Updated</option>
          <option value="created">Created</option>
          <option value="name">Name</option>
        </select>
      </div>
    </div>

    <div class="notes-list scroll-thin" id="notesList"></div>

    <div class="theme-row">
      <button class="theme-chip" data-theme="light" title="light" aria-label="light theme">
        <svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-sun"/></svg><span class="theme-label">light</span>
      </button>
      <button class="theme-chip" data-theme="dark" title="dark" aria-label="dark theme">
        <svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-moon"/></svg><span class="theme-label">dark</span>
      </button>
      <button class="theme-chip" data-theme="amoled" title="amoled" aria-label="amoled theme">
        <svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-contrast"/></svg><span class="theme-label">amoled</span>
      </button>
      <button class="theme-chip" data-theme="sepia" title="sepia" aria-label="sepia theme">
        <svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-book"/></svg><span class="theme-label">sepia</span>
      </button>
      <button class="btn-icon ml-auto" id="btnCmdPalette2" title="Command palette (⌘K)" aria-label="Command palette">
        <svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-command"/></svg>
      </button>
    </div>

    <div class="resize-handle" id="resizeHandle" aria-hidden="true"></div>
  </aside>

  <!-- MAIN -->
  <main class="main-panel" id="mainPanel">

    <div id="editorView" class="editor-view hidden">
      <!-- Toolbar -->
      <div class="toolbar glass-strong scroll-x-thin">
        <button class="tool-btn mobile-back-btn" id="btnMobileBack" title="Back to notes" aria-label="Back to notes"><svg viewBox="0 0 24 24" class="icon"><use href="#i-arrow-left"/></svg></button>
        <input id="titleInput" class="title-input" placeholder="Untitled" aria-label="Note title" />

        <div class="tool-group">
          <button class="tool-btn" id="btnUndo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24" class="icon"><use href="#i-undo"/></svg></button>
          <button class="tool-btn" id="btnRedo" title="Redo (⌘⇧Z)"><svg viewBox="0 0 24 24" class="icon"><use href="#i-redo"/></svg></button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" data-cmd="bold" title="Bold (⌘B)"><svg viewBox="0 0 24 24" class="icon"><use href="#i-bold"/></svg></button>
          <button class="tool-btn" data-cmd="italic" title="Italic (⌘I)"><svg viewBox="0 0 24 24" class="icon"><use href="#i-italic"/></svg></button>
          <button class="tool-btn" data-cmd="underline" title="Underline"><svg viewBox="0 0 24 24" class="icon"><use href="#i-underline"/></svg></button>
          <button class="tool-btn" data-cmd="strikeThrough" title="Strikethrough"><svg viewBox="0 0 24 24" class="icon"><use href="#i-strike"/></svg></button>
        </div>
        <div class="tool-group">
          <div class="popover-wrap" id="textColorWrap">
            <button class="tool-btn" id="btnTextColor" title="Text color"><svg viewBox="0 0 24 24" class="icon"><use href="#i-type"/></svg></button>
          </div>
          <div class="popover-wrap" id="fontSizeWrap">
            <button class="tool-btn" id="btnFontSize" title="Font size"><svg viewBox="0 0 24 24" class="icon"><use href="#i-size"/></svg></button>
          </div>
          <div class="popover-wrap" id="insertWrap">
            <button class="tool-btn" id="btnInsert" title="Insert"><svg viewBox="0 0 24 24" class="icon"><use href="#i-insert"/></svg></button>
          </div>
        </div>
        <div class="tool-group">
          <button class="tool-btn" data-block="H1" title="Heading 1"><svg viewBox="0 0 24 24" class="icon"><use href="#i-h1"/></svg></button>
          <button class="tool-btn" data-block="H2" title="Heading 2"><svg viewBox="0 0 24 24" class="icon"><use href="#i-h2"/></svg></button>
          <button class="tool-btn" data-block="H3" title="Heading 3"><svg viewBox="0 0 24 24" class="icon"><use href="#i-h3"/></svg></button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" data-cmd="insertUnorderedList" title="Bulleted list"><svg viewBox="0 0 24 24" class="icon"><use href="#i-list"/></svg></button>
          <button class="tool-btn" data-cmd="insertOrderedList" title="Numbered list"><svg viewBox="0 0 24 24" class="icon"><use href="#i-list-ordered"/></svg></button>
          <button class="tool-btn" data-block="BLOCKQUOTE" title="Quote"><svg viewBox="0 0 24 24" class="icon"><use href="#i-quote"/></svg></button>
          <button class="tool-btn" data-block="PRE" title="Code block"><svg viewBox="0 0 24 24" class="icon"><use href="#i-code"/></svg></button>
          <button class="tool-btn" id="btnHr" title="Divider"><svg viewBox="0 0 24 24" class="icon"><use href="#i-minus"/></svg></button>
        </div>
        <div class="tool-group">
          <div class="popover-wrap" id="colorPopoverWrap">
            <button class="tool-btn" id="btnColor" title="Label color"><svg viewBox="0 0 24 24" class="icon"><use href="#i-palette"/></svg></button>
          </div>
          <button class="tool-btn" id="btnPin" title="Pin"><svg viewBox="0 0 24 24" class="icon"><use href="#i-pin"/></svg></button>
          <button class="tool-btn" id="btnFav" title="Favorite"><svg viewBox="0 0 24 24" class="icon"><use href="#i-star"/></svg></button>
          <button class="tool-btn" id="btnPreview" title="View mode (read-only)"><svg viewBox="0 0 24 24" class="icon"><use href="#i-eye"/></svg></button>
          <button class="tool-btn" id="btnHistory" title="Version history"><svg viewBox="0 0 24 24" class="icon"><use href="#i-history"/></svg></button>
        </div>
        <div class="tool-group tool-group-last">
          <div class="popover-wrap" id="moreMenuWrap">
            <button class="tool-btn" id="btnMore" title="More"><svg viewBox="0 0 24 24" class="icon"><use href="#i-more"/></svg></button>
          </div>
          <input type="file" id="importFileInput" accept=".txt,.md,.json" class="hidden" multiple />
        </div>
      </div>

      <!-- Floating popovers/menus: JS moves these to <body> on init so they
           can never be clipped by the toolbar's horizontal scroll, and they
           become bottom sheets on mobile. -->
      <div class="floating-menu popover glass-strong" id="colorPopover">
        <button class="swatch swatch-clear" data-color="" title="Clear">✕</button>
        <button class="swatch" data-color="oklch(0.82 0.15 75)" style="background:oklch(0.82 0.15 75)" aria-label="amber"></button>
        <button class="swatch" data-color="oklch(0.75 0.17 15)" style="background:oklch(0.75 0.17 15)" aria-label="rose"></button>
        <button class="swatch" data-color="oklch(0.72 0.15 155)" style="background:oklch(0.72 0.15 155)" aria-label="emerald"></button>
        <button class="swatch" data-color="oklch(0.75 0.13 230)" style="background:oklch(0.75 0.13 230)" aria-label="sky"></button>
        <button class="swatch" data-color="oklch(0.7 0.17 300)" style="background:oklch(0.7 0.17 300)" aria-label="violet"></button>
      </div>
      <div class="floating-menu popover glass-strong" id="textColorPopover">
        <button class="swatch swatch-clear" data-tcolor="inherit" title="Default">✕</button>
        <button class="swatch" data-tcolor="#e11d48" style="background:#e11d48" aria-label="red"></button>
        <button class="swatch" data-tcolor="#d97706" style="background:#d97706" aria-label="amber"></button>
        <button class="swatch" data-tcolor="#16a34a" style="background:#16a34a" aria-label="green"></button>
        <button class="swatch" data-tcolor="#2563eb" style="background:#2563eb" aria-label="blue"></button>
        <button class="swatch" data-tcolor="#7c3aed" style="background:#7c3aed" aria-label="violet"></button>
      </div>
      <div class="floating-menu menu glass-strong" id="fontSizeMenu">
        <button class="menu-item" data-fsize="12px">Small</button>
        <button class="menu-item" data-fsize="15px">Normal</button>
        <button class="menu-item" data-fsize="20px">Large</button>
        <button class="menu-item" data-fsize="28px">Huge</button>
      </div>
      <div class="floating-menu menu glass-strong" id="insertMenu">
        <button class="menu-item" id="mInsertLink"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-link"/></svg>Insert link</button>
        <button class="menu-item" id="mInsertImage"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-image"/></svg>Insert image</button>
        <button class="menu-item" id="mInsertChecklist"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-checklist"/></svg>Insert checklist</button>
      </div>
      <div class="floating-menu menu glass-strong" id="moreMenu">
        <button class="menu-item" id="mExportTxt"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-download"/></svg>Export as .txt</button>
        <button class="menu-item" id="mExportMd"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-download"/></svg>Export as .md</button>
        <button class="menu-item" id="mExportJson"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-download"/></svg>Export as .json</button>
        <button class="menu-item" id="mExportPdf"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-download"/></svg>Export as PDF</button>
        <button class="menu-item" id="mExportAll"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-download"/></svg>Export all (backup)</button>
        <button class="menu-item" id="mImport"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-upload"/></svg>Import file…</button>
        <button class="menu-item" id="mZen"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-feather"/></svg>Toggle Zen mode</button>
        <button class="menu-item" id="mFocus"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-palette"/></svg>Toggle Focus mode</button>
        <button class="menu-item" id="mFullscreen"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-maximize"/></svg><span id="fsLabel">Fullscreen</span></button>
      </div>

      <!-- Editor / Preview -->
      <div class="editor-scroll scroll-thin">
        <div class="editor-inner">
          <div id="editor" class="editor-content" contenteditable="true" spellcheck="true" role="textbox" aria-label="Note content" data-empty="Start writing…"></div>
        </div>
      </div>

      <!-- Floating quick actions -->
      <div class="editor-fab-group" id="editorFabGroup">
        <button class="editor-fab" id="btnCopyAll" title="Copy all text" aria-label="Copy all text"><svg viewBox="0 0 24 24" class="icon"><use href="#i-copy"/></svg></button>
        <button class="editor-fab danger" id="btnDeleteAll" title="Delete all text" aria-label="Delete all text"><svg viewBox="0 0 24 24" class="icon"><use href="#i-trash"/></svg></button>
      </div>

      <!-- Status bar -->
      <div class="status-bar glass">
        <span id="statWords">0 words</span>
        <span id="statChars">0 chars</span>
        <span id="statRead">~1 min read</span>
        <span class="ml-auto" id="statSaved"></span>
        <span id="statEdited">Edited just now</span>
      </div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon shine"><svg viewBox="0 0 24 24" class="icon icon-lg"><use href="#i-feather"/></svg></div>
      <h1 class="empty-title">A private place to think.</h1>
      <p class="empty-sub">TinyNote is a private, fast notepad. Nothing leaves this device — write freely, anytime.</p>
      <button id="btnEmptyNew" class="btn-primary">Create your first note</button>
    </div>

    <!-- History panel -->
    <div id="historyOverlay" class="overlay overlay-end hidden">
      <div class="history-panel glass-strong" id="historyPanelInner">
        <div class="history-head">
          <svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-history"/></svg>
          <div class="history-title">Version history</div>
          <button class="btn-icon ml-auto" id="btnCloseHistory" aria-label="Close"><svg viewBox="0 0 24 24" class="icon icon-sm"><use href="#i-x"/></svg></button>
        </div>
        <div class="history-body scroll-thin" id="historyBody"></div>
      </div>
    </div>
  </main>

  <!-- Command palette -->
  <div id="cmdOverlay" class="overlay overlay-top hidden">
    <div class="cmd-palette glass-strong anim-float" id="cmdPaletteInner">
      <div class="cmd-head">
        <svg viewBox="0 0 24 24" class="icon icon-sm muted"><use href="#i-command"/></svg>
        <input id="cmdInput" class="cmd-input" placeholder="Type a command or search notes…" autofocus />
        <kbd class="kbd">Esc</kbd>
      </div>
      <div class="cmd-body scroll-thin" id="cmdBody"></div>
    </div>
  </div>

  <!-- Drag-and-drop file import overlay -->
  <div id="dropOverlay" class="drop-overlay hidden">
    <div class="drop-overlay-inner">
      <div class="drop-overlay-icon"><svg viewBox="0 0 24 24" class="icon icon-lg"><use href="#i-upload"/></svg></div>
      <p>Drop to import into TinyNote</p>
      <span>.txt · .md · .json supported</span>
    </div>
  </div>

</div>
